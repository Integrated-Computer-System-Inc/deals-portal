# ==============================================================================
# NGINX Configuration for Deals Registration Portal
# Port: 4000 (External/Public) -> Reverse Proxy to Next.js PM2 (127.0.0.1:4001)
# ==============================================================================
# 
# HOW TO INTEGRATE INTO YOUR EXISTING NGINX ON WINDOWS:
# ------------------------------------------------------------------------------
# Option A (Recommended):
#   Open your main Nginx config file (typically `C:\nginx\conf\nginx.conf` or `conf/nginx.conf`),
#   and inside the `http { ... }` block, add the following line:
#
#       include "C:/Users/<YourUser>/Documents/ICS projects/deals-portal/nginx/deals-portal.conf";
#       (Note: Use forward slashes '/' in Nginx paths even on Windows)
#
# Option B:
#   Copy the entire `server { ... }` block below directly inside the `http { ... }`
#   block of your existing `nginx.conf`.
#
# Then reload Nginx:
#   nginx -t          # Test configuration for syntax errors
#   nginx -s reload   # Reload Nginx without downtime
# ==============================================================================

server {
    listen 4000;
    server_name localhost _;

    # Maximum payload size for file uploads and large batch reports
    client_max_body_size 50M;

    # Performance & Timeout Settings
    proxy_connect_timeout       60s;
    proxy_send_timeout          600s;
    proxy_read_timeout          600s;
    send_timeout                600s;

    # Gzip Compression for Next.js assets & API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Next.js Immutable Static Assets (Cached for 1 Year)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache headers for static immutable assets
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Next.js Public Static Files (Favicons, Images, Icons)
    # --------------------------------------------------------------------------
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Main Next.js Application & Server Actions / API Routes
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy forwarding headers (Essential for NextAuth and Server Actions)
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
